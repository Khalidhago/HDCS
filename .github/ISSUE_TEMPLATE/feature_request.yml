name: Feature Request
description: Propose improvements to HDCS architecture, governance, or templates.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What gap are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the proposed change and expected outcome.
    validations:
      required: true
  - type: textarea
    id: domain
    attributes:
      label: Domain
      description: UAV/UAS, autonomy, AI/CV, GIS, industrial, software/devsecops, research.
    validations:
      required: true
