name: Feature Request
description: Propose a feature with engineering rationale and measurable value.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Engineering Problem
      description: What technical problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions
  - type: textarea
    id: risks
    attributes:
      label: Risks
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
  - type: textarea
    id: success
    attributes:
      label: Success Criteria
      description: Define measurable outcomes.
